    iframe{display:block;width:100%;height:min(88vh,1050px);border:0;background:#fff}
    @media(max-width:640px){main{width:min(100% - 1rem,1160px);padding-top:.75rem}.topbar strong{font-size:.875rem}.topbar a{padding:.45rem .7rem;font-size:.75rem}.board{margin-bottom:.75rem;border-radius:.5rem}.pdf-section{margin-top:1.25rem;border-radius:.5rem}.pdf-head{align-items:flex-start;flex-direction:column}.pdf-head a{width:100%;text-align:center}iframe{height:78vh}}
